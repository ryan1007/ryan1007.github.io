<!doctype html>
<html lang="zh-TW">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="50_Lan_logo.png" type="image/png" />
    <title>50嵐訂購小幫手</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        background: linear-gradient(135deg, #ffd93d 0%, #ffed4e 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }

      .header {
        background: #0066cc;
        color: white;
        padding: 30px;
        text-align: center;
      }

      .header h1 {
        font-size: 28px;
        margin-bottom: 10px;
      }

      .header p {
        font-size: 16px;
        opacity: 0.9;
      }

      .form-container {
        padding: 40px 30px;
      }

      .form-group {
        margin-bottom: 25px;
      }

      label {
        display: block;
        font-weight: bold;
        color: #333;
        margin-bottom: 8px;
        font-size: 16px;
      }

      label .required {
        color: #e74c3c;
      }

      input[type="text"],
      select {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 15px;
        transition: all 0.3s;
        font-family: "Microsoft JhengHei", Arial, sans-serif;
      }

      input[type="text"]:focus,
      select:focus {
        outline: none;
        border-color: #0066cc;
        box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
      }

      select {
        cursor: pointer;
        background-color: white;
      }

      .drink-button {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #0066cc;
        border-radius: 8px;
        font-size: 15px;
        background-color: white;
        color: #333;
        cursor: pointer;
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        font-weight: 500;
        transition: all 0.3s;
        text-align: left;
      }

      .drink-button:hover {
        background-color: #f0f0f0;
        border-color: #0066cc;
      }

      /* 模態框 */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        overflow: auto;
      }

      .modal.active {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .modal-content {
        background-color: white;
        border-radius: 15px;
        max-height: 85vh;
        width: 90%;
        max-width: 600px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        overflow-y: auto;
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          transform: translateY(-50px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .modal-header {
        background: #0066cc;
        color: white;
        padding: 20px;
        border-radius: 15px 15px 0 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .modal-header h2 {
        font-size: 20px;
        margin: 0;
      }

      .close-btn {
        background: none;
        border: none;
        color: white;
        font-size: 28px;
        cursor: pointer;
        padding: 0;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .close-btn:hover {
        opacity: 0.8;
      }

      .modal-body {
        padding: 20px;
      }

      .drink-category {
        margin-bottom: 20px;
      }

      .category-title {
        font-weight: bold;
        color: #0066cc;
        margin-bottom: 10px;
        font-size: 16px;
        padding-bottom: 8px;
        border-bottom: 2px solid #e0e0e0;
      }

      .drink-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .drink-item {
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
        background-color: white;
        text-align: center;
        font-size: 14px;
      }

      .drink-item:hover {
        border-color: #0066cc;
        background-color: #f0f7ff;
        transform: translateY(-2px);
      }

      .drink-item.selected {
        background-color: #0066cc;
        color: white;
        border-color: #0066cc;
      }

      .drink-name {
        font-weight: 500;
        margin-bottom: 4px;
      }

      .drink-price {
        font-size: 13px;
        opacity: 0.8;
      }

      @media (max-width: 600px) {
        .modal-content {
          width: 95%;
          max-height: 90vh;
        }

        .drink-list {
          grid-template-columns: 1fr;
        }
      }

      .radio-group {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin-top: 10px;
      }

      .radio-option {
        flex: 0 0 calc(33.333% - 10px);
      }

      .radio-option input[type="radio"] {
        display: none;
      }

      .radio-option label {
        display: block;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s;
        font-weight: normal;
        margin: 0;
      }

      .radio-option input[type="radio"]:checked + label {
        background: #0066cc;
        color: white;
        border-color: #0066cc;
      }

      .radio-option.hot-option input[type="radio"]:checked + label {
        background: #dc3545;
        color: white;
        border-color: #dc3545;
      }

      .radio-option label:hover {
        border-color: #0066cc;
      }

      .radio-option.hot-option label:hover {
        border-color: #dc3545;
      }

      .submit-btn {
        width: 100%;
        padding: 15px;
        background: #0066cc;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 10px;
      }

      .submit-btn:hover {
        background: #0052a3;
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(0, 102, 204, 0.3);
      }

      .submit-btn:active {
        transform: translateY(0);
      }

      .note {
        background: #fff3cd;
        border-left: 4px solid #ffc107;
        padding: 15px;
        margin-top: 20px;
        border-radius: 4px;
        font-size: 14px;
        color: #856404;
      }

      @media (max-width: 600px) {
        .radio-option {
          flex: 0 0 calc(50% - 7.5px);
        }

        .form-container {
          padding: 30px 20px;
        }
      }
    </style>
  </head>

            </div>

            <label>甜度 <span class="required">*</span></label>
            <div class="radio-group">

              </div>
            </div>
          </div>

            <label>冰塊 <span class="required">*</span></label>
            <div class="radio-group">
              <div class="radio-option">
                <input
                  type="radio"

            </div>
          </div>

            💡 提示：送出後您的訂單將會被記錄，請確認資料無誤再送出喔！

        </form>

    </div>

      // 初始化飲料目錄
      function initDrinkCatalog() {
        const catalog = document.getElementById("drinkCatalog");
        catalog.innerHTML = "";

        for (const [category, drinkList] of Object.entries(drinks)) {
          const categoryDiv = document.createElement("div");
          categoryDiv.className = "drink-category";

          const titleDiv = document.createElement("div");
          titleDiv.className = "category-title";
          titleDiv.textContent = category;
          categoryDiv.appendChild(titleDiv);

          const listDiv = document.createElement("div");
          listDiv.className = "drink-list";

          for (const drink of drinkList) {
            const drinkItem = document.createElement("div");
            drinkItem.className = "drink-item";
            drinkItem.innerHTML = `<div class="drink-name">${drink.name}</div><div class="drink-price">$${drink.price}</div>`;
            drinkItem.dataset.name = drink.name;
            drinkItem.dataset.price = drink.price;

            drinkItem.addEventListener("click", function () {
              selectDrink(this);
            });

            listDiv.appendChild(drinkItem);
          }

          categoryDiv.appendChild(listDiv);
          catalog.appendChild(categoryDiv);
        }
      }

      // 選擇飲料
      function selectDrink(element) {
        // 移除其他已選擇的狀態
        document
          .querySelectorAll(".drink-item.selected")
          .forEach((item) => item.classList.remove("selected"));

        // 標記為已選擇
        element.classList.add("selected");

        // 更新隱藏欄位的值
        const drinkName = element.dataset.name;
        const drinkPrice = element.dataset.price;

        document.getElementById("drink").value = drinkName;
        document.getElementById("price").value = drinkPrice;

        // 更新按鈕顯示
        document.getElementById("drinkBtn").textContent =
          `✅ ${drinkName} - ${drinkPrice}元`;

        // 關閉模態框
        closeModal();
      }

      // 打開模態框
      function openModal() {
        document.getElementById("drinkModal").classList.add("active");
      }

      // 關閉模態框
      function closeModal() {
        document.getElementById("drinkModal").classList.remove("active");
      }

      // 事件監聽 - 打開飲料選單
      document
        .getElementById("drinkBtn")
        .addEventListener("click", function () {
          openModal();
        });

      // 事件監聽 - 關閉按鈕
      document
        .querySelector(".close-btn")
        .addEventListener("click", function () {
          closeModal();
        });

      // 事件監聽 - 點擊模態框外部關閉
      document
        .getElementById("drinkModal")
        .addEventListener("click", function (e) {
          if (e.target === this) {
            closeModal();
          }
        });

      // 初始化頁面
      document.addEventListener("DOMContentLoaded", function () {
        initDrinkCatalog();
      });

      // 表單提交
      document
        .getElementById("orderForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          // 取得表單資料
          const name = document.getElementById("name").value;
          const drink = document.getElementById("drink").value;
          const price = document.getElementById("price").value;
          const sugar = document.querySelector(
            'input[name="sugar"]:checked',
          ).value;
          const ice = document.querySelector('input[name="ice"]:checked').value;

          if (!drink) {
            alert("請選擇飲料！");
            return;
          }

          // Google表單的欄位ID (需要從您的Google表單中取得)
          // 請先開啟您的Google表單，檢視原始碼找出每個欄位的entry ID
          // 以下是範例ID，您需要替換成實際的ID
          const formUrl =
            "https://docs.google.com/forms/d/e/1FAIpQLSfHesQQVdKlHQrKthtBNn3u_R-tumyxIlNgsuGbtlA8--3ZsQ/formResponse";

          // 建立FormData - 請將entry.xxxxxxx替換成您Google表單的實際欄位ID
          const formData = new FormData();
          formData.append("entry.1617503351", name); // 姓名欄位ID
          formData.append("entry.1419920221", drink); // 飲料品項欄位ID
          formData.append("entry.519317847", sugar); // 甜度欄位ID
          formData.append("entry.896911968", ice); // 冰塊欄位ID
          formData.append("entry.1591600544", price); // 價格欄位ID

          // 使用iframe送出表單（避免CORS問題）
          const iframe = document.createElement("iframe");
          iframe.name = "hidden_iframe";
          iframe.style.display = "none";
          document.body.appendChild(iframe);

          const form = document.createElement("form");
          form.method = "POST";
          form.action = formUrl;
          form.target = "hidden_iframe";

          formData.forEach((value, key) => {
            const input = document.createElement("input");
            input.type = "hidden";
            input.name = key;
            input.value = value;
            form.appendChild(input);
          });

          document.body.appendChild(form);
          form.submit();

          // 顯示成功訊息
          alert(
            `✅ 訂單已送出！\n\n姓名：${name}\n飲料：${drink}\n價格：$${price}\n甜度：${sugar}\n冰塊：${ice}\n\n`,
          );

          // 重置表單
          document.getElementById("orderForm").reset();
          document.getElementById("drinkBtn").textContent = "請選擇飲料 ⬇️";

          // 清理
          setTimeout(() => {
            document.body.removeChild(form);
            document.body.removeChild(iframe);
          }, 1000);
        });
    </script>
  </body>
</html>
