<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50嵐飲料訂購表單</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #ffd93d 0%, #ffed4e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: #0066cc;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .form-container {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 16px;
        }

        label .required {
            color: #e74c3c;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }

        select {
            cursor: pointer;
            background-color: white;
        }

        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
        }

        .radio-option {
            flex: 0 0 calc(33.333% - 10px);
        }

        .radio-option input[type="radio"] {
            display: none;
        }

        .radio-option label {
            display: block;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: normal;
            margin: 0;
        }

        .radio-option input[type="radio"]:checked + label {
            background: #0066cc;
            color: white;
            border-color: #0066cc;
        }

        .radio-option label:hover {
            border-color: #0066cc;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #0052a3;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 102, 204, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .note {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
            font-size: 14px;
            color: #856404;
        }

        @media (max-width: 600px) {
            .radio-option {
                flex: 0 0 calc(50% - 7.5px);
            }

            .form-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>

                            <option value="烏龍拿鐵 (M)">烏龍拿鐵 (M) - $50</option>

    <script>
        // 當飲料選項改變時，自動提取價格
        document.getElementById('drink').addEventListener('change', function() {
            const selectedOption = this.options[this.selectedIndex];
            const drinkText = selectedOption.text;
            
            // 從選項文字中提取價格（例如：茉莉綠茶 (M) - $30）
            const priceMatch = drinkText.match(/\$(\d+)/);
            const price = priceMatch ? priceMatch[1] : '';
            
            // 將價格存入隱藏欄位
            document.getElementById('price').value = price;
        });

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 取得表單資料
            const name = document.getElementById('name').value;
            const drink = document.getElementById('drink').value;
            const price = document.getElementById('price').value;
            const sugar = document.querySelector('input[name="sugar"]:checked').value;
            const ice = document.querySelector('input[name="ice"]:checked').value;
            
            // Google表單的欄位ID (需要從您的Google表單中取得)
            // 請先開啟您的Google表單，檢視原始碼找出每個欄位的entry ID
            // 以下是範例ID，您需要替換成實際的ID
            const formUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSfHesQQVdKlHQrKthtBNn3u_R-tumyxIlNgsuGbtlA8--3ZsQ/formResponse';
            
            // 建立FormData - 請將entry.xxxxxxx替換成您Google表單的實際欄位ID
            const formData = new FormData();
            formData.append('entry.1617503351', name);        // 姓名欄位ID
            formData.append('entry.1419920221', drink);       // 飲料品項欄位ID
            formData.append('entry.519317847', sugar);       // 甜度欄位ID
            formData.append('entry.896911968', ice);         // 冰塊欄位ID
            formData.append('entry.1591600544', price);       // 價格欄位ID (新增)
            
            // 使用iframe送出表單（避免CORS問題）
            const iframe = document.createElement('iframe');
            iframe.name = 'hidden_iframe';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);
            
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = formUrl;
            form.target = 'hidden_iframe';
            
            formData.forEach((value, key) => {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = value;
                form.appendChild(input);
            });
            
            document.body.appendChild(form);
            form.submit();
            
            // 顯示成功訊息
            alert(`✅ 訂單已送出！\n\n姓名：${name}\n飲料：${drink}\n價格：$${price}\n甜度：${sugar}\n冰塊：${ice}\n\n感謝您的訂購！`);
            
            // 重置表單
            document.getElementById('orderForm').reset();
            
            // 清理
            setTimeout(() => {
                document.body.removeChild(form);
                document.body.removeChild(iframe);
            }, 1000);
        });
    </script>
</body>
</html>
